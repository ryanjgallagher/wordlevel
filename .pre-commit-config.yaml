repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: gen-api-docs
        name: gen-api-docs
        entry: uv run python docs/scripts/gen_api_docs.py
        language: system
        pass_filenames: false
        files: ^(src/wordlevel/.*\.py|docs/scripts/gen_api_docs\.py)$