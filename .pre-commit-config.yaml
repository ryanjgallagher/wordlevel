repos:
  # Runs before Ruff so that the types it generates are formatted in the same pass
  - repo: local
    hooks:
      - id: generate-lexicon-types
        name: generate lexicon types
        entry: uv run python -m lexicons.generate_types
        language: system
        files: ^lexicons/(processor\.py|[^/]+/process\.py)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1  # If this version is updated, update in pyproject.toml too
    hooks:
      - id: ruff-check
        exclude: ^docs/snippets/
      - id: ruff-format
        exclude: ^docs/snippets/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^(lexicons/[^/]+/data/|docs/documentation/api/)
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false