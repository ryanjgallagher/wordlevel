name: Install

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Installs the built wheel with only the dependencies declared in pyproject.toml to test a typical 
  # install by a user
  install:
    runs-on: ubuntu-latest
    name: wordlevel${{ matrix.extras }} (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"
        extras:
          - ""
          - "[save]"
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # hatch-vcs reads the version from the tags
          fetch-depth: 0

      - name: Enable uv caching
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Install Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      # The interpreter is named explicitly from here on, so that nothing resolves out of the
      # project itself and the dev dependencies cannot quietly satisfy an undeclared import
      - name: Install wheel
        run: |
          uv venv
          uv pip install "$(ls dist/*.whl)${{ matrix.extras }}"

      - name: Import every module in the package
        run: .venv/bin/python .github/scripts/import_all.py

      - name: Check that the save extra installs the export backend
        if: matrix.extras == '[save]'
        run: .venv/bin/python -c "import vl_convert"

      - name: Check that a base install leaves out the export backend
        if: matrix.extras == ''
        run: |
          if .venv/bin/python -c "import vl_convert" 2>/dev/null; then
            echo "Error: vl_convert is installed without the 'save' extra flag"
            exit 1
          fi