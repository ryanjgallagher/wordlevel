name: Pyright

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '!docs/scripts/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yaml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '!docs/scripts/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yaml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyright-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.15"
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enable uv caching
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true

      - name: Install Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run Pyright
        run: uv run --no-sync pyright
