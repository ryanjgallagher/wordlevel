name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  type-check:
    uses: ./.github/workflows/pyright.yaml

  lint:
    uses: ./.github/workflows/ruff.yaml

  install:
    uses: ./.github/workflows/install.yaml

  build:
    needs: [test, type-check, lint, install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install Python and enable uv caching
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wordlevel
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086

  github-release:
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      - name: Determine if pre-release
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ (a[0-9]+|b[0-9]+|rc[0-9]+|dev[0-9]+)$ ]]; then
            echo "flag=true" >> "$GITHUB_OUTPUT"
          else
            echo "flag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.flag }}
          draft: ${{ steps.prerelease.outputs.flag == 'false' }}
