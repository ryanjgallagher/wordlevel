name: Process lexicons

on:
  pull_request:
    branches:
      - main
    paths:
      # Only trigger this workflow if files inside the lexicons/ folder change
      - 'lexicons/**'

permissions:
  contents: read

concurrency:
  group: lexicons-pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Detect and Categorize Changes
  # ==========================================
  changed-lexicons:
    runs-on: ubuntu-latest
    outputs:
      lexicon_changes: ${{ steps.detect.outputs.lexicon_changes }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        id: detect
        uses: ./.github/actions/detect-changed-lexicons

  # ==========================================
  # JOB 2: Process Lexicons (No Uploading)
  # ==========================================
  process-lexicons:
    needs: changed-lexicons
    if: ${{ needs.changed-lexicons.outputs.lexicon_changes != '[]' && needs.changed-lexicons.outputs.lexicon_changes != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lexicon: ${{ fromJSON(needs.changed-lexicons.outputs.lexicon_changes) }}
    
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Download and process lexicons
        if: ${{ matrix.lexicon.processor_changed == true }}
        uses: ./.github/actions/process-lexicons
        with:
          lexicon: ${{ matrix.lexicon.name }}