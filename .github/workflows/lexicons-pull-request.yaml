name: Process lexicons

on:
  pull_request:
    branches:
      - main
    paths:
      # Only trigger this workflow if files inside the lexicons/ folder change, or if the types
      # that the lexicons generate are edited directly
      - 'lexicons/**'
      - 'src/wordlevel/lexicons/types/**'

permissions:
  contents: read

concurrency:
  group: lexicons-pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Detect and Categorize Changes
  # ==========================================
  changed-lexicons:
    runs-on: ubuntu-latest
    outputs:
      lexicon_changes: ${{ steps.detect.outputs.lexicon_changes }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect Changes
        id: detect
        uses: ./.github/actions/detect-changed-lexicons

  # ==========================================
  # JOB 2: Process Lexicons (No Uploading)
  # ==========================================
  process-lexicons:
    needs: changed-lexicons
    if: ${{ needs.changed-lexicons.outputs.lexicon_changes != '[]' && needs.changed-lexicons.outputs.lexicon_changes != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lexicon: ${{ fromJSON(needs.changed-lexicons.outputs.lexicon_changes) }}
    
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Download and process lexicons
        if: ${{ matrix.lexicon.processor_changed == true }}
        uses: ./.github/actions/process-lexicons
        with:
          lexicon: ${{ matrix.lexicon.name }}

  # ==========================================
  # JOB 3: Check Generated Types
  # ==========================================
  check-lexicon-types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Generate the types of every lexicon
        run: |
          uv run --no-sync python -m lexicons.generate_types --strict lexicons/processor.py
          uv run --no-sync ruff format --check src/wordlevel/lexicons/types

      - name: Check that the generated types are committed
        run: |
          # Untracked files are checked too, since types written to the wrong place leave every
          # tracked file untouched. Note, untracked files must have been generated by this job
          if [ -n "$(git status --porcelain src/wordlevel)" ]; then
            git status --porcelain src/wordlevel
            echo "::error::The generated lexicon types are out of date. Regenerate them and commit the result"
            exit 1
          fi