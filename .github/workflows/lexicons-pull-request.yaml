name: Process lexicons

on:
  pull_request:
    branches:
      - main
    paths:
      # Only trigger this workflow if files inside the lexicons/ folder change
      - 'lexicons/**'

permissions:
  contents: read

concurrency:
  group: lexicons-pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Detect and Categorize Changes
  # ==========================================
  changed-lexicons:
    runs-on: ubuntu-latest
    outputs:
      lexicon_changes: ${{ steps.detect.outputs.lexicon_changes }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Detect Changes
        id: detect
        uses: ./.github/actions/detect-changed-lexicons

  # ==========================================
  # JOB 2: Process Lexicons (No Uploading)
  # ==========================================
  process-lexicons:
    needs: changed-lexicons
    if: ${{ needs.changed-lexicons.outputs.lexicon_changes != '[]' && needs.changed-lexicons.outputs.lexicon_changes != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lexicon: ${{ fromJSON(needs.changed-lexicons.outputs.lexicon_changes) }}
    
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Download and process lexicons
        if: ${{ matrix.lexicon.processor_changed == true }}
        uses: ./.github/actions/process-lexicons
        with:
          lexicon: ${{ matrix.lexicon.name }}

      - name: Check that the generated types are committed
        if: ${{ matrix.lexicon.processor_changed == true }}
        run: |
          uv run --no-sync python -m lexicons.generate_types lexicons/${{ matrix.lexicon.name }}/process.py
          uv run --no-sync ruff format src/wordlevel/api/lexicons/types

          # Untracked files are checked too, since types written to the wrong place leave every
          # tracked file untouched. Note, untracked files must have been generated by this job
          if [ -n "$(git status --porcelain src/wordlevel)" ]; then
            git status --porcelain src/wordlevel
            echo "::error::The generated types for ${{ matrix.lexicon.name }} are out of date. Regenerate them and commit the result"
            exit 1
          fi