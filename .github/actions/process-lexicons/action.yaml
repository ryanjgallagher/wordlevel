name: 'Process Lexicon Data'
description: 'Downloads raw lexicon data from Hugging Face and processes it'

inputs:
  lexicon:
    description: 'The name of the lexicon'
    required: true

runs:
  using: "composite"
  steps:
    - name: Download Raw Lexicon Data
      shell: bash
      run: uv run python -m lexicons.huggingface --mode download --data raw --lexicon ${{ inputs.lexicon }}
        
    - name: Process Lexicon
      shell: bash
      run: uv run python -m lexicons.${{ inputs.lexicon }}.process