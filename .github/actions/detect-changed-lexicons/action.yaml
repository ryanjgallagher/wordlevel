name: 'Detect Changed Lexicons'
description: 'Determines which lexicons changed and how'

outputs:
  lexicon_changes:
    description: "A JSON array of lexicons and booleans indicating how they have changed"
    value: ${{ steps.detect-lexicons.outputs.lexicon_changes }}

runs:
  using: "composite"
  steps:
    # Callers check out with fetch-depth: 0, so the whole range is available. The three dots diff
    # against the merge base, so a pull request does not pick up commits that landed on main after
    # it branched. ACMR leaves out deletions, so removing a lexicon's file does not queue it for
    # processing
    - name: Get Changed Files
      id: changed-files
      shell: bash
      env:
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      run: |
        changed_files=$(git diff --name-only --diff-filter=ACMR "$BASE...HEAD" -- lexicons | tr '\n' ' ')
        echo "all_changed_files=$changed_files" >> "$GITHUB_OUTPUT"

    - name: Detected Changed Lexicon Files
      id: detect-lexicons
      shell: bash
      env:
        CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: python .github/scripts/process_lexicons.py "$CHANGED_FILES"