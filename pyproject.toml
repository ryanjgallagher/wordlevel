[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wordlevel"
description = "A Python package for word-level analysis of text"
readme = "README.md"
authors = [
  {name = "Ryan J. Gallagher"}
]
version = "0.0.1"
requires-python = ">= 3.10"
dependencies = [
  "altair>=5.5.0",
  "huggingface-hub>=1.10.1",
  "polars",
]

[dependency-groups]
dev = [
    "pytest",
    "altair[all]>=5.5.0",
    "ruff>=0.12.8",
    "pre-commit>=4.3.0",
    "huggingface-hub>=1.10.1",
    "pyright>=1.1.409",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
show-fixes = true

[tool.pyright]
include = ["src", "lexicons"]