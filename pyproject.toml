# Build
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/wordlevel/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wordlevel"]

# General metadata and requirements
[project]
name = "wordlevel"
authors = [
  {name = "Ryan J. Gallagher"}
]
dynamic = ["version"]

description = "A Python package for word-level analysis of text"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">= 3.10"
dependencies = [
  "altair>=5.5.0",
  "huggingface-hub>=1.10.1",
  "polars",
]

[project.urls]
#Homepage = ""
#Documentation = ""
Repository = "https://github.com/ryanjgallagher/wordlevel"


# Development
[dependency-groups]
dev = [
  "pytest",
  "altair[all]>=5.5.0",
  "ruff>=0.12.8",
  "pre-commit>=4.3.0",
  "huggingface-hub>=1.10.1",
  "pyright>=1.1.409",
]
docs = [
  "mkdocstrings-python>=2.0.3",
  "zensical>=0.0.40",
  "tomlkit>=0.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
show-fixes = true
force-exclude = true
extend-exclude = ["docs/snippets"]

[tool.pyright]
include = ["src", "lexicons"]
