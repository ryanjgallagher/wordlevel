# Build
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/wordlevel/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wordlevel"]

# General metadata and requirements
[project]
name = "wordlevel"
authors = [
  {name = "Ryan J. Gallagher"}
]
dynamic = ["version"]

description = "A Python package for word-level analysis of text"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.10"
dependencies = [
  "altair>=5.5.0",
  "huggingface-hub>=1.2.1",
  "platformdirs>=2.0.0",
  "polars>=1.30.0",
  "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
save = [
  "altair[save]>=5.5.0",
]

[project.urls]
#Homepage = ""
#Documentation = ""
Repository = "https://github.com/ryanjgallagher/wordlevel"

# Development
[dependency-groups]
dev = [
  "altair[all]>=5.5.0",
  "griffelib>=2.0.0",
  "mkdocstrings-python>=2.0.3",
  "pre-commit>=4.3.0",
  "pyright>=1.1.409",
  "pytest>=8.0.0",
  "ruff==0.15.0",  # If this version is updated, update in .pre-commit-config.yaml too
  "tomlkit>=0.13.0",
  "zensical>=0.0.40",
]

[tool.pytest.ini_options]
pythonpath = [".", ".github/scripts"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
show-fixes = true
force-exclude = true
extend-exclude = ["docs/snippets"]

[tool.ruff.lint]
# D419 (empty docstring)
ignore = ["D419"]

[tool.pyright]
include = ["src", "lexicons"]
