# Build
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/wordlevel/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wordlevel"]

# General metadata and requirements
[project]
name = "wordlevel"
authors = [
  {name = "Ryan J. Gallagher"}
]
dynamic = ["version"]

description = "A Python package for word-level analysis of text"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.10"
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "altair>=5.5.0",
  "huggingface-hub>=1.2.1",
  "narwhals>=2.4.0",
  "platformdirs>=2.0.0",
  "polars>=1.30.0",
  "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
save = [
  "altair[save]>=5.5.0",
]

[project.urls]
Homepage = "https://wordlevel.dev"
Repository = "https://github.com/ryanjgallagher/wordlevel"

# Development
[dependency-groups]
dev = [
  "altair[all]>=5.5.0",
  "duckdb>=1.0.0",
  "griffelib>=2.0.0",
  "markdown-exec>=1.12.3",
  "mkdocstrings-python>=2.0.3",
  "pandas>=2.2.2",
  "pre-commit>=4.3.0",
  "pyarrow>=15.0.0",
  "pyright>=1.1.409",
  "pytest>=8.0.0",
  "ruff==0.16.1",  # If this version is updated, update in .pre-commit-config.yaml too
  "tomlkit>=0.13.0",
  "zensical>=0.0.47",
]

[tool.codespell]
ignore-words-list = "thats"  # Used in lexicon exclusion example because it's a word from a corpus

[tool.pytest.ini_options]
pythonpath = [".", ".github/scripts"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
show-fixes = true
force-exclude = true
extend-exclude = ["docs/snippets"]
src = [".", "src", ".github/scripts"]

[tool.ruff.lint]
# D419 (empty docstring)
ignore = ["D419"]

[tool.ruff.lint.isort]
lines-after-imports = 2
extra-standard-library = ["tomllib"]

[tool.pyright]
include = ["src", "lexicons", "docs/scripts/api_docs"]
