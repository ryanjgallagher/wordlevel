[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "wordlevel"
description = "A Python package for word-level analysis of text"
readme = "README.md"
authors = [
  {name = "Ryan J. Gallagher"}
]
version = "0.0.1"
requires-python = ">= 3.10"
dependencies = [
  "altair>=5.5.0",
  "polars",
]

[dependency-groups]
dev = [
    "pytest",
    "altair[all]>=5.5.0"
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
